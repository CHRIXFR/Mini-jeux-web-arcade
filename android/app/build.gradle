plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('signing/keystore.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'fr.chrix.arcademinimaliste'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.chrix.arcademinimaliste'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        familyRelease {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.familyRelease
            }
        }
    }
}
