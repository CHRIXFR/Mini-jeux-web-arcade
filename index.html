<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Minimaliste - Jeux Web</title>
    <meta name="description" content="Une collection de mini-jeux élégants et gratuits : Sudoku, Mots Mêlés et plus.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Configuration Analytique (GoatCounter) -->
    <script>
        window.goatcounter = {
            no_onload: true, // Désactiver le suivi automatique (on le gère manuellement)
            // REMPLACER "mon-code-goatcounter" PAR VOTRE IDENTIFIANT GOATCOUNTER
            endpoint: 'https://mini-arcade.goatcounter.com/count'
        };
    </script>
    <script data-goatcounter="https://mini-arcade.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <!-- Driver.js pour le Tour Guidé -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css" />
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

    <!-- SortableJS pour le Drag & Drop des jeux (Favoris) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body class="dark-mode">
    <header>
        <div class="header-content">
            <h1 id="main-title">Arcade Minimaliste</h1>
            <div class="user-stats">
                <button id="tour-btn" class="theme-toggle" onclick="window.arcade.startTour()"
                    title="Lancer le guide d'accueil">❓</button>
                <button id="theme-btn" class="theme-toggle" onclick="window.arcade.toggleTheme()"
                    title="Changer de thème">☀️</button>
                <button id="audio-btn" class="theme-toggle" onclick="window.arcade.toggleAudio()"
                    title="Activer/Désactiver le son">🔇</button>
            </div>
        </div>
    </header>

    <main id="app-container">
        <!-- Contenu injecté dynamiquement -->
    </main>

    <!-- Modale Changelog & Suggestions -->
    <div id="changelog-modal" class="modal-overlay" style="display: none;" aria-hidden="true" role="dialog"
        aria-labelledby="changelog-title">
        <div class="modal-content changelog-modal-content">

            <!-- Navigation par onglets -->
            <div class="changelog-tabs" role="tablist">
                <button class="tab-btn active" id="tab-btn-changelog" role="tab" aria-selected="true"
                    aria-controls="tab-changelog" onclick="switchTab('changelog')">Nouveautés 🚀</button>
                <button class="tab-btn" id="tab-btn-suggestion" role="tab" aria-selected="false"
                    aria-controls="tab-suggestion" onclick="switchTab('suggestion')">Suggérer 💡</button>
            </div>

            <!-- Panneau Changelog -->
            <div id="tab-changelog" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-changelog">
                <div class="changelog-list">
                    <ul id="changelog-list-content">
                        <li>Chargement des dernières nouveautés... ⏳</li>
                    </ul>
                </div>
            </div>

            <!-- Panneau Formulaire de Suggestion -->
            <div id="tab-suggestion" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-suggestion">
                <p class="suggestion-intro">Une idée de jeu ou de fonctionnalité ? Faites-le nous savoir !</p>
                <form id="suggestion-form" class="suggestion-form">
                    <div class="form-group">
                        <label for="suggestion-name">Votre prénom (optionnel)</label>
                        <input type="text" id="suggestion-name" name="name" placeholder="Ex : Alex" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="suggestion-type">Type de suggestion</label>
                        <select id="suggestion-type" name="type">
                            <option value="Nouveau Jeu">🎮 Nouveau Jeu</option>
                            <option value="Nouvelle Fonctionnalité">✨ Nouvelle Fonctionnalité</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="suggestion-message">Votre suggestion <span aria-hidden="true">*</span></label>
                        <textarea id="suggestion-message" name="message" rows="4" placeholder="Décrivez votre idée..."
                            required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;" id="suggestion-submit-btn">Envoyer
                        🚀</button>
                </form>
                <div id="suggestion-success" class="form-success" style="display: none;">
                    <span>✅</span> Merci pour votre suggestion ! Nous l'avons bien reçue.
                </div>
            </div>

            <!-- Bouton Fermer commun -->
            <button
                onclick="document.getElementById('changelog-modal').style.display='none'; document.getElementById('changelog-modal').setAttribute('aria-hidden', 'true');"
                class="btn-secondary changelog-close-btn">Fermer</button>
        </div>
    </div>

    <!-- Avatar Changelog -->
    <button id="avatar-changelog"
        onclick="document.getElementById('changelog-modal').style.display='flex'; document.getElementById('changelog-modal').setAttribute('aria-hidden', 'false');"
        title="Voir les nouveautés" aria-label="Voir les nouveautés">
        <video autoplay loop muted playsinline width="100" height="100" poster="images/personnage_saluant.jpeg">
            <source src="images/Vidéo_de_personnage_saluant_en_boucle.mp4" type="video/mp4">
            <!-- Fallback pour navigateurs ne supportant pas la vidéo -->
            <img src="images/personnage_saluant.jpeg" alt="Avatar qui salue" width="100" height="100">
        </video>
    </button>

    <footer>
        <p>&copy; 2026 Arcade Minimaliste | Projet Open-Source</p>
    </footer>

    <!-- Scripts chargés classiquement (non-module pour test local) -->
    <script>
        // --- Gestion de la modale Changelog ---

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isActive = btn.id === `tab-btn-${tabName}`;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive);
            });
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.toggle('active', panel.id === `tab-${tabName}`);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('suggestion-form');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = document.getElementById('suggestion-submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Envoi en cours...';

                try {
                    const response = await fetch('https://formspree.io/f/xqedogeo', {
                        method: 'POST',
                        headers: { 'Accept': 'application/json' },
                        body: new FormData(form)
                    });

                    if (response.ok) {
                        form.style.display = 'none';
                        document.getElementById('suggestion-success').style.display = 'flex';
                        // Réinitialise l'état pour la prochaine ouverture
                        setTimeout(() => {
                            form.reset();
                            form.style.display = 'block';
                            document.getElementById('suggestion-success').style.display = 'none';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Envoyer 🚀';
                        }, 4000);
                    } else {
                        throw new Error('Réponse non-OK du serveur.');
                    }
                } catch (_err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Envoyer 🚀';
                    window.arcade.showToast('Erreur lors de l\'envoi. Réessayez.');
                }
            });

            // Chargement du changelog dynamique
            fetchChangelog();
        });

        // --- Recuperation dynamique du Changelog depuis GitHub ---
        async function fetchChangelog() {
            const listContent = document.getElementById('changelog-list-content');
            if (!listContent) return;

            try {
                // Appel à l'API publique de GitHub pour récupérer les derniers commits
                const response = await fetch('https://api.github.com/repos/CHRIXFR/Mini-jeux-web-arcade/commits?sha=main&per_page=30');
                if (!response.ok) throw new Error('Erreur API GitHub');

                const commits = await response.json();

                // Filtrer les commits contenant le tag personnalisé 'News:'
                const newsCommits = commits.filter(item => {
                    return item.commit.message.includes('News:');
                });

                if (newsCommits.length === 0) {
                    listContent.innerHTML = '<li>Aucune nouveauté récente trouvée. 🕵️‍♂️</li>';
                    return;
                }

                // Vider le message de chargement
                listContent.innerHTML = '';

                // Formater et injecter chaque news
                newsCommits.forEach(item => {
                    const message = item.commit.message;
                    // On retire le tag 'News:' (insensible à la casse si on le souhaite, ici on cherche le texte exact ou similaire)
                    const cleanMessage = message.replace(/News:\s*/i, '').trim();

                    // Formatage de la date (ex: "03/03/2026")
                    const dateObj = new Date(item.commit.author.date);
                    const formattedDate = dateObj.toLocaleDateString('fr-FR', {
                        day: '2-digit', month: '2-digit', year: 'numeric'
                    });

                    // Création de l'élément de liste
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${formattedDate}</strong> : ${cleanMessage}`;
                    listContent.appendChild(li);
                });

            } catch (error) {
                console.error('Erreur lors du chargement du changelog:', error);
                listContent.innerHTML = '<li>Impossible de charger les nouveautés pour le moment. ⚠️</li>';
            }
        }

        // Définition d'un store global simple pour remplacer Zustand/Imports
        window.arcade = {
            state: {
                theme: localStorage.getItem('arcade_theme_fixed') || localStorage.getItem('arcade_theme') || 'dark',
                themeMode: localStorage.getItem('arcade_theme_mode') || 'fixed',
                currentView: 'home',
                testMode: new URLSearchParams(window.location.search).has('test')
            },
            lifecycle: {
                installed: false,
                buckets: {},
                native: {}
            },
            themes: [
                { id: 'dark', icon: '🌙', bg: 'radial-gradient(1200px 780px at 18% -8%, rgba(99,102,241,0.42) 0%, rgba(9,9,11,0) 58%), radial-gradient(1000px 640px at 92% 106%, rgba(217,70,239,0.24) 0%, rgba(9,9,11,0) 55%), linear-gradient(145deg, #09090b 0%, #111127 48%, #130d1f 100%)' },
                { id: 'light', icon: '☀️', bg: 'radial-gradient(1200px 840px at 8% -15%, rgba(251,191,36,0.3) 0%, rgba(248,250,252,0) 52%), radial-gradient(980px 620px at 94% 115%, rgba(59,130,246,0.22) 0%, rgba(248,250,252,0) 52%), linear-gradient(155deg, #f8fafc 0%, #eef2ff 48%, #ecfeff 100%)' },
                { id: 'neon', icon: '⚡', bg: 'radial-gradient(980px 700px at 12% 0%, rgba(217,70,239,0.52) 0%, rgba(11,9,20,0) 52%), radial-gradient(900px 620px at 92% 102%, rgba(6,182,212,0.34) 0%, rgba(11,9,20,0) 50%), linear-gradient(140deg, #090814 0%, #170c2a 45%, #0f1833 100%)' },
                { id: 'ocean', icon: '🌊', bg: 'radial-gradient(1080px 760px at 10% -10%, rgba(56,189,248,0.46) 0%, rgba(8,47,73,0) 56%), radial-gradient(900px 620px at 92% 110%, rgba(20,184,166,0.3) 0%, rgba(8,47,73,0) 54%), linear-gradient(155deg, #06283f 0%, #0a4d70 52%, #0e7490 100%)' },
                { id: 'volcanic', icon: '🌋', bg: 'radial-gradient(1050px 700px at 15% 0%, rgba(248,113,113,0.56) 0%, rgba(25,6,12,0) 56%), radial-gradient(940px 640px at 88% 110%, rgba(251,146,60,0.38) 0%, rgba(25,6,12,0) 54%), linear-gradient(145deg, #18070f 0%, #2a0d16 45%, #3a120f 100%)' },
                { id: 'forest', icon: '🌲', bg: 'radial-gradient(1000px 700px at 12% 0%, rgba(52,211,153,0.44) 0%, rgba(6,24,20,0) 54%), radial-gradient(900px 620px at 92% 108%, rgba(163,230,53,0.26) 0%, rgba(6,24,20,0) 52%), linear-gradient(150deg, #061814 0%, #0a2a23 48%, #133a2c 100%)' },
                { id: 'sunset', icon: '🌅', bg: 'radial-gradient(1040px 730px at 14% -8%, rgba(244,114,182,0.5) 0%, rgba(29,8,28,0) 54%), radial-gradient(920px 620px at 94% 114%, rgba(251,191,36,0.34) 0%, rgba(29,8,28,0) 52%), linear-gradient(150deg, #16081e 0%, #3a1433 46%, #4b1f2f 100%)' },
                { id: 'mono', icon: '⚪', bg: 'radial-gradient(1200px 780px at 16% -10%, rgba(163,163,163,0.2) 0%, rgba(10,10,10,0) 56%), radial-gradient(860px 620px at 92% 108%, rgba(82,82,82,0.22) 0%, rgba(10,10,10,0) 52%), linear-gradient(150deg, #050505 0%, #151515 54%, #101010 100%)' },
                { id: 'retro', icon: '🕹️', bg: 'radial-gradient(1020px 720px at 12% 0%, rgba(250,204,21,0.42) 0%, rgba(21,15,5,0) 54%), radial-gradient(900px 640px at 92% 112%, rgba(251,146,60,0.3) 0%, rgba(21,15,5,0) 52%), linear-gradient(145deg, #120d05 0%, #221208 42%, #2e1911 100%)' },
                { id: 'aurora', icon: '🧊', bg: 'radial-gradient(1060px 740px at 14% -10%, rgba(45,212,191,0.45) 0%, rgba(7,12,30,0) 56%), radial-gradient(920px 620px at 92% 112%, rgba(125,211,252,0.3) 0%, rgba(7,12,30,0) 54%), linear-gradient(150deg, #060d22 0%, #0c1b3e 46%, #142d5e 100%)' }
            ],
            games: [
                { id: 'hangman', name: 'Le Pendu', icon: '😵', difficulty: 'Normal' },
                { id: 'mots-meles', name: 'Mots Mêlés', icon: '🔍', difficulty: 'Normal' },
                { id: 'paires', name: 'Paires', icon: '🃏', difficulty: 'Variable' },
                { id: 'sudoku', name: 'Sudoku', icon: '🧩', difficulty: 'Facile - Difficile' },
                { id: 'match-3', name: 'Match-3', icon: '💎', difficulty: 'Puzzle' },
                { id: 'capitales', name: 'Capitales', icon: '🌍', difficulty: 'Culture G' },
                { id: 'scrabble', name: 'Scrabble', icon: '🔡', difficulty: 'Expert' },
                { id: 'tetris', name: 'Tetris', icon: '🧱', difficulty: 'Arcade' },
                { id: 'objets-caches', name: 'Objets Cachés', icon: '🕵️', difficulty: 'Observation' },
                { id: 'blind-test', name: 'Blind Test 8-Bits', icon: '🎵', difficulty: 'Musical' },
                { id: 'snake', name: 'Snake', icon: '🐍', difficulty: 'Arcade' },
                { id: 'neon-pulse', name: 'Neon Pulse', icon: '☄️', difficulty: 'Casse-briques (10 Niveaux)' },
                { id: '421', name: '421', icon: '🎲', difficulty: 'Arcade' },
                { id: 'uno', name: 'UNO', icon: '🃏', difficulty: 'Solo IA / Multi local' },
                { id: 'suite-logique', name: 'Suite Logique', icon: '🧠', difficulty: 'Forme / Chiffre / Mixte' },
                { id: 'echecs', name: 'Échecs', icon: '♟️', difficulty: 'Local 2J / IA niveaux' }
            ],
            showToast: function (msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => { t.classList.add('show'); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000); }, 100);
            },
            _getTrackedGameId: function () {
                const currentView = this.state && this.state.currentView;
                if (!currentView || currentView === 'home') return null;
                return currentView;
            },
            _ensureLifecycleBucket: function (gameId) {
                if (!gameId) return null;
                if (!this.lifecycle.buckets[gameId]) {
                    this.lifecycle.buckets[gameId] = {
                        intervals: new Set(),
                        timeouts: new Set(),
                        rafs: new Set(),
                        listeners: [],
                        cleanups: []
                    };
                }
                return this.lifecycle.buckets[gameId];
            },
            _trackHandle: function (type, handle, gameId) {
                if (!gameId || handle == null) return;
                const bucket = this._ensureLifecycleBucket(gameId);
                if (!bucket || !bucket[type]) return;
                bucket[type].add(handle);
            },
            _untrackHandle: function (type, handle) {
                if (handle == null) return;
                const buckets = this.lifecycle.buckets;
                Object.keys(buckets).forEach((gameId) => {
                    const bucket = buckets[gameId];
                    if (bucket && bucket[type]) {
                        bucket[type].delete(handle);
                    }
                });
            },
            _registerTrackedListener: function (target, type, listener, options, gameId) {
                if (!gameId || !target || !type || !listener) return;
                const bucket = this._ensureLifecycleBucket(gameId);
                if (!bucket) return;
                bucket.listeners.push({ target, type, listener, options });
            },
            _unregisterTrackedListener: function (target, type, listener) {
                const buckets = this.lifecycle.buckets;
                Object.keys(buckets).forEach((gameId) => {
                    const bucket = buckets[gameId];
                    if (!bucket || !bucket.listeners) return;
                    bucket.listeners = bucket.listeners.filter((entry) => {
                        return !(entry.target === target && entry.type === type && entry.listener === listener);
                    });
                });
            },
            installLifecycleGuards: function () {
                if (this.lifecycle.installed) return;
                this.lifecycle.installed = true;

                const lc = this.lifecycle;
                lc.native.setInterval = window.setInterval.bind(window);
                lc.native.clearInterval = window.clearInterval.bind(window);
                lc.native.setTimeout = window.setTimeout.bind(window);
                lc.native.clearTimeout = window.clearTimeout.bind(window);
                lc.native.requestAnimationFrame = window.requestAnimationFrame.bind(window);
                lc.native.cancelAnimationFrame = window.cancelAnimationFrame.bind(window);

                window.setInterval = (...args) => {
                    const handle = lc.native.setInterval(...args);
                    const gameId = this._getTrackedGameId();
                    this._trackHandle('intervals', handle, gameId);
                    return handle;
                };
                window.clearInterval = (handle) => {
                    this._untrackHandle('intervals', handle);
                    return lc.native.clearInterval(handle);
                };
                window.setTimeout = (...args) => {
                    const handle = lc.native.setTimeout(...args);
                    const gameId = this._getTrackedGameId();
                    this._trackHandle('timeouts', handle, gameId);
                    return handle;
                };
                window.clearTimeout = (handle) => {
                    this._untrackHandle('timeouts', handle);
                    return lc.native.clearTimeout(handle);
                };
                window.requestAnimationFrame = (callback) => {
                    const handle = lc.native.requestAnimationFrame(callback);
                    const gameId = this._getTrackedGameId();
                    this._trackHandle('rafs', handle, gameId);
                    return handle;
                };
                window.cancelAnimationFrame = (handle) => {
                    this._untrackHandle('rafs', handle);
                    return lc.native.cancelAnimationFrame(handle);
                };

                lc.native.windowAdd = window.addEventListener.bind(window);
                lc.native.windowRemove = window.removeEventListener.bind(window);
                lc.native.documentAdd = document.addEventListener.bind(document);
                lc.native.documentRemove = document.removeEventListener.bind(document);

                window.addEventListener = (type, listener, options) => {
                    const gameId = this._getTrackedGameId();
                    this._registerTrackedListener(window, type, listener, options, gameId);
                    return lc.native.windowAdd(type, listener, options);
                };
                window.removeEventListener = (type, listener, options) => {
                    this._unregisterTrackedListener(window, type, listener);
                    return lc.native.windowRemove(type, listener, options);
                };

                document.addEventListener = (type, listener, options) => {
                    const gameId = this._getTrackedGameId();
                    this._registerTrackedListener(document, type, listener, options, gameId);
                    return lc.native.documentAdd(type, listener, options);
                };
                document.removeEventListener = (type, listener, options) => {
                    this._unregisterTrackedListener(document, type, listener);
                    return lc.native.documentRemove(type, listener, options);
                };
            },
            registerGameCleanup: function (cleanupFn, gameId) {
                if (typeof cleanupFn !== 'function') return () => { };
                const resolvedGameId = gameId || this._getTrackedGameId();
                if (!resolvedGameId) return () => { };
                const bucket = this._ensureLifecycleBucket(resolvedGameId);
                bucket.cleanups.push(cleanupFn);
                return () => {
                    const idx = bucket.cleanups.indexOf(cleanupFn);
                    if (idx >= 0) bucket.cleanups.splice(idx, 1);
                };
            },
            cleanupGameResources: function (gameId) {
                if (!gameId || gameId === 'home') return;
                const bucket = this.lifecycle.buckets[gameId];
                if (!bucket) return;

                bucket.cleanups.forEach((cleanup) => {
                    try { cleanup(); } catch (_err) { }
                });
                bucket.cleanups = [];

                bucket.intervals.forEach((handle) => this.lifecycle.native.clearInterval(handle));
                bucket.intervals.clear();
                bucket.timeouts.forEach((handle) => this.lifecycle.native.clearTimeout(handle));
                bucket.timeouts.clear();
                bucket.rafs.forEach((handle) => this.lifecycle.native.cancelAnimationFrame(handle));
                bucket.rafs.clear();

                bucket.listeners.forEach((entry) => {
                    try {
                        if (entry.target === window) {
                            this.lifecycle.native.windowRemove(entry.type, entry.listener, entry.options);
                        } else if (entry.target === document) {
                            this.lifecycle.native.documentRemove(entry.type, entry.listener, entry.options);
                        } else if (entry.target && entry.target.removeEventListener) {
                            entry.target.removeEventListener(entry.type, entry.listener, entry.options);
                        }
                    } catch (_err) { }
                });
                bucket.listeners = [];

                delete this.lifecycle.buckets[gameId];
            },
            formatTime: function (seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            },
            getThemeById: function (themeId) {
                return this.themes.find((theme) => theme.id === themeId) || this.themes[0];
            },
            getThemeModeLabel: function () {
                return this.state.themeMode === 'random' ? 'Mode aléatoire actif' : 'Mode fixe actif';
            },
            setThemeMode: function (mode) {
                this.state.themeMode = mode === 'random' ? 'random' : 'fixed';
                localStorage.setItem('arcade_theme_mode', this.state.themeMode);
                if (this.state.themeMode === 'random') {
                    this.selectRandomTheme();
                } else {
                    const fixedTheme = this.getThemeById(localStorage.getItem('arcade_theme_fixed') || this.state.theme);
                    this.state.theme = fixedTheme.id;
                    localStorage.setItem('arcade_theme_fixed', fixedTheme.id);
                    localStorage.setItem('arcade_theme', fixedTheme.id);
                    this.applyTheme();
                }
                this.updateThemeModeUI();
            },
            toggleThemeMode: function () {
                const nextMode = this.state.themeMode === 'fixed' ? 'random' : 'fixed';
                this.setThemeMode(nextMode);
            },
            selectRandomTheme: function () {
                if (!this.themes.length) return;
                const lastRandom = localStorage.getItem('arcade_theme_last_random');
                const candidates = this.themes.filter((theme) => theme.id !== lastRandom);
                const pool = candidates.length ? candidates : this.themes;
                const randomTheme = pool[Math.floor(Math.random() * pool.length)];
                this.state.theme = randomTheme.id;
                localStorage.setItem('arcade_theme_last_random', randomTheme.id);
                localStorage.setItem('arcade_theme', randomTheme.id);
                this.applyTheme();
            },
            updateThemeModeUI: function () {
                const modeBtn = document.getElementById('theme-mode-btn');
                const modeLabel = document.getElementById('theme-mode-label');
                if (modeBtn) {
                    modeBtn.textContent = this.state.themeMode === 'random' ? 'Mode: Aléatoire' : 'Mode: Fixe';
                    modeBtn.setAttribute('aria-pressed', this.state.themeMode === 'random' ? 'true' : 'false');
                }
                if (modeLabel) {
                    modeLabel.textContent = `${this.getThemeModeLabel()} · Thème actuel: ${this.getThemeById(this.state.theme).icon}`;
                }
                const themeBtn = document.getElementById('theme-btn');
                if (themeBtn) {
                    themeBtn.title = this.state.themeMode === 'random'
                        ? 'Mode aléatoire actif (retour accueil = nouveau thème)'
                        : 'Changer de thème';
                }
            },
            renderHome: function () {
                const previousView = this.state.currentView;
                if (previousView && previousView !== 'home') {
                    this.cleanupGameResources(previousView);
                }
                document.body.className = document.body.className
                    .split(/\s+/)
                    .filter((cls) => cls && !cls.startsWith('game-'))
                    .join(' ');
                document.body.classList.remove('in-game');
                this.state.currentView = 'home';
                if (this.state.themeMode === 'random') {
                    this.selectRandomTheme();
                } else {
                    this.applyTheme();
                }

                // Nettoyage modales de jeu standardisées
                const startModal = document.getElementById('game-start-modal');
                if (startModal) startModal.remove();
                const overModal = document.getElementById('game-over-modal');
                if (overModal) overModal.remove();

                const avatar = document.getElementById('avatar-changelog');
                if (avatar) avatar.style.display = 'flex';

                // Texte hero sans XP
                const heroText = 'Choisissez un jeu, lancez une session rapide et battez vos records.';
                const lastGameId = localStorage.getItem('arcade_last_game');
                const lastGame = this.games.find((g) => g.id === lastGameId) || null;

                // --- CHARGEMENT DE L'ORDRE PERSONNALISÉ DES JEUX FAVORIS ---
                let orderedGames = [...this.games];
                try {
                    const savedOrderStr = localStorage.getItem('arcade_custom_order');
                    if (savedOrderStr) {
                        const savedOrder = JSON.parse(savedOrderStr);
                        if (Array.isArray(savedOrder)) {
                            orderedGames.sort((a, b) => {
                                const indexA = savedOrder.indexOf(a.id);
                                const indexB = savedOrder.indexOf(b.id);
                                if (indexA === -1 && indexB === -1) return 0;
                                if (indexA === -1) return 1; // les nouveaux jeux ou non classés vont à la fin
                                if (indexB === -1) return -1;
                                return indexA - indexB;
                            });
                        }
                    }
                } catch (e) { console.error('Erreur lecture ordre', e); }

                const gridHtml = orderedGames.map(game => {
                    const clickAction = `onclick="window.arcade.loadGame('${game.id}')"`;
                    const accessibilityProps = 'role="button" tabindex="0"';

                    // Récupérer le score depuis localstorage
                    const storageKey = `arcade_hs_${game.id}`;
                    const hsData = JSON.parse(localStorage.getItem(storageKey));
                    let hsHtml = '';
                    if (hsData) {
                        const val = hsData.type === 'time' ? window.arcade.formatTime(hsData.score) : hsData.score;
                        const label = hsData.type === 'time' ? 'Meilleur Temps' : 'Record';
                        hsHtml = `<div class="hs-badge" title="${label} : ${val}">⭐ ${val}</div>`;
                    }

                    return `
                        <div class="game-card" data-id="${game.id}" ${clickAction} ${accessibilityProps}>
                            <div class="drag-handle" title="Trier les favoris (Glisser-Déposer)" onclick="event.stopPropagation()">☰</div>
                            ${hsHtml}
                            <div class="game-icon" role="img" aria-label="Icône du jeu ${game.name}">${game.icon}</div>
                            <h3>${game.name}</h3>
                            <p>${this.getGameDescription(game.id)}</p>
                            <div class="game-meta">
                                <span class="difficulty">${game.difficulty}</span>
                                <span class="game-cta">Jouer</span>
                            </div>
                        </div>
                    `;
                }).join('');

                document.getElementById('app-container').innerHTML = `
                    <section id="home-page" class="view">
                        <div class="hero">
                            <p class="subtitle">${heroText}</p>
                            <div class="hero-actions">
                                <button id="btn-scroll-games" class="btn-primary hero-btn-primary" aria-label="Voir les jeux" onclick="document.getElementById('games-grid-container').scrollIntoView({ behavior: 'smooth' })">Découvrir les jeux</button>
                                ${lastGame ? `<button class="btn-secondary hero-btn-secondary" aria-label="Reprendre ${lastGame.name}" onclick="window.arcade.loadGame('${lastGame.id}')">Reprendre ${lastGame.name}</button>` : ''}
                            </div>
                            <div class="hero-theme-controls">
                                <button id="theme-mode-btn" class="btn-secondary hero-theme-mode-btn" aria-pressed="false" onclick="window.arcade.toggleThemeMode()"></button>
                                <span id="theme-mode-label" class="hero-theme-mode-label"></span>
                            </div>
                            <div class="hero-meta">
                                <span class="hero-chip">🎮 ${orderedGames.length} jeux disponibles</span>
                                <span class="hero-chip">📱 Desktop + mobile optimisé</span>
                                <span class="hero-chip">🏆 Records locaux automatiques</span>
                            </div>
                        </div>
                        <div id="games-grid-container" class="games-grid">${gridHtml}</div>
                    </section>
                `;

                // --- INIT SORTABLEJS ---
                const gridContainer = document.getElementById('games-grid-container');
                if (gridContainer && window.Sortable) {
                    new Sortable(gridContainer, {
                        handle: '.drag-handle', // La poignée pour glisser
                        animation: 150, // Animation fluide (MS)
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            // Sauvegarde du nouvel ordre après relâchement
                            const itemEls = gridContainer.querySelectorAll('.game-card');
                            const newOrder = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                            localStorage.setItem('arcade_custom_order', JSON.stringify(newOrder));
                        }
                    });
                }

                // Lancement BGM de l'accueil
                if (window.arcade.audio) {
                    window.arcade.audio.setContext('base');
                    window.arcade.audio.playMusic();
                }

                // Analytique (GoatCounter)
                if (window.goatcounter && window.goatcounter.count) {
                    window.goatcounter.count({
                        path: '/',
                        title: 'Accueil Arcade',
                        event: false
                    });
                }
                this.updateThemeModeUI();
            },
            getGameDescription: function (id) {
                const descriptions = {
                    'sudoku': 'Le classique jeu de chiffres avec fonctions avancées.',
                    'hangman': 'Devinez le mot secret avant qu\'il ne soit trop tard.',
                    'mots-meles': 'Trouvez tous les mots cachés dans la grille.',
                    'paires': 'Exercez votre mémoire en trouvant toutes les paires d\'emojis.',
                    'match-3': 'Alignez les gemmes pour exploser les scores.',
                    'capitales': 'Testez vos connaissances sur les drapeaux et capitales du monde.',
                    'scrabble': 'Placez vos mots stratégiquement sur le plateau.',
                    'tetris': 'L\'indémodable jeu de puzzle par blocs avec un style moderne.',
                    'objets-caches': 'Retrouvez les objets cachés avant la fin du temps imparti.',
                    'blind-test': 'Devinez la musique jouée par le synthétiseur.',
                    'snake': 'Dirigez le serpent et mangez des pommes.',
                    'neon-pulse': 'Détruisez les briques et accumulez les bonus dans ce casse-briques lumineux.',
                    '421': 'Jeu de dés score-attack : 10 manches pour atteindre 30 points.',
                    'uno': 'UNO classique : solo contre IA ou multi local 2/3/4 joueurs.',
                    'suite-logique': 'Complétez des suites logiques en mode forme, chiffre ou mixte.',
                    'echecs': 'Jouez aux échecs en local 2 joueurs ou contre IA à difficulté réglable.'
                };
                return descriptions[id] || '';
            },
            dictionaryCache: {
                words: null,
                async getWords() {
                    if (!this.words) {
                        const r = await fetch('games/data/French ODS dictionary.json');
                        if (!r.ok) throw new Error('Dictionnaire introuvable');
                        this.words = await r.json();
                    }
                    return this.words;
                }
            },
            toggleTheme: function () {
                if (this.state.themeMode === 'random') {
                    this.showToast('Mode aléatoire actif : passez en mode fixe pour choisir un thème.');
                    return;
                }
                const foundIndex = this.themes.findIndex(t => t.id === this.state.theme);
                const currentIndex = foundIndex >= 0 ? foundIndex : 0;
                const nextIndex = (currentIndex + 1) % this.themes.length;
                this.state.theme = this.themes[nextIndex].id;
                localStorage.setItem('arcade_theme_fixed', this.state.theme);
                localStorage.setItem('arcade_theme', this.state.theme);
                this.applyTheme();
            },
            toggleAudio: function () {
                if (window.arcade.audio) {
                    const isMuted = window.arcade.audio.toggleMute();
                    const audioBtn = document.getElementById('audio-btn');
                    if (audioBtn) {
                        audioBtn.textContent = isMuted ? '🔇' : '🔊';
                    }
                }
            },
            applyTheme: function () {
                const current = this.themes.find(t => t.id === this.state.theme) || this.themes[0];

                this.themes.forEach((theme) => document.body.classList.remove(`${theme.id}-mode`));
                document.body.classList.add(`${current.id}-mode`);

                const themeBtn = document.getElementById('theme-btn');
                if (themeBtn) themeBtn.textContent = current.icon;

                let bgElement = document.getElementById('dynamic-bg');
                if (!bgElement) {
                    bgElement = document.createElement('div');
                    bgElement.id = 'dynamic-bg';
                    document.body.prepend(bgElement);
                }

                bgElement.style.backgroundImage = current.bg;
                bgElement.classList.add('loaded');
                this.updateThemeModeUI();
            },
            isTourDisabled: function () {
                const params = new URLSearchParams(window.location.search);
                const forcedDisable = params.get('tour') === 'off';
                return forcedDisable || this.state.testMode || !!navigator.webdriver;
            },
            startTour: function () {
                if (this.isTourDisabled()) return;
                if (!window.driver) return;
                const isHome = this.state.currentView === 'home';
                const steps = [
                    { element: '#main-title', popover: { title: 'Bienvenue', description: 'Ceci est l\'Arcade Minimaliste. Découvrez des mini-jeux classiques dans une enveloppe moderne !', side: "bottom" } },
                    { element: '#tour-btn', popover: { title: 'Aide', description: 'Cliquez ici à tout moment pour revoir ce guide.', side: "bottom" } },
                    { element: '#theme-btn', popover: { title: 'Thèmes Dynamiques', description: 'Parcourez les thèmes en mode fixe. Le mode aléatoire est disponible dans le panneau accueil.', side: "bottom" } },
                    { element: '#audio-btn', popover: { title: 'Sons & Musique', description: 'Activez l\'ambiance sonore pour une meilleure immersion (BGM et effets).', side: "bottom" } }
                ];

                if (isHome) {
                    steps.push({ element: '#avatar-changelog', popover: { title: 'Nouveautés & Suggestions', description: 'Cliquez sur l\'avatar pour voir le changelog ou nous envoyer vos idées.', side: "left" } });
                    steps.push({ element: '#games-grid-container', popover: { title: 'Vos Favoris', description: 'Utilisez l\'icône ☰ sur chaque carte pour glisser et organiser vos jeux favoris en tête de liste !', side: "top" } });
                    steps.push({ element: '#games-grid-container', popover: { title: 'Accès Immédiat & Scores', description: 'Battez vos records : ils sont sauvegardés localement.', side: "top" } });
                }

                const driverObj = window.driver.js.driver({
                    showProgress: true,
                    nextBtnText: 'Suivant →',
                    prevBtnText: '← Précédent',
                    doneBtnText: 'C\'est parti !',
                    steps: steps
                });
                driverObj.drive();
            },
            checkFirstVisit: function () {
                if (this.isTourDisabled()) return;
                if (!localStorage.getItem('arcade_tour_done')) {
                    setTimeout(() => {
                        this.startTour();
                        localStorage.setItem('arcade_tour_done', 'true');
                    }, 500);
                }
            },
            loadGame: function (id) {
                this.installLifecycleGuards();
                const previousView = this.state.currentView;
                if (previousView && previousView !== 'home' && previousView !== id) {
                    this.cleanupGameResources(previousView);
                }
                document.body.className = document.body.className
                    .split(/\s+/)
                    .filter((cls) => cls && !cls.startsWith('game-'))
                    .join(' ');
                document.body.classList.add('in-game');
                document.body.classList.add(`game-${id}`);
                this.state.currentView = id;
                localStorage.setItem('arcade_last_game', id);
                const avatar = document.getElementById('avatar-changelog');
                if (avatar) avatar.style.display = 'none';
                document.getElementById('app-container').innerHTML = `
                    <div class="game-view">
                        <button onclick="window.arcade.renderHome()" class="btn-secondary">← Retour</button>
                        <div id="game-mount"></div>
                    </div>
                `;

                // Contexte audio adapté au jeu
                if (window.arcade.audio) {
                    window.arcade.audio.setContext(id);
                    window.arcade.audio.playMusic();
                }

                // Analytique (GoatCounter) - Événement jeu joué
                if (window.goatcounter && window.goatcounter.count) {
                    window.goatcounter.count({
                        path: `load-game-${id}`,
                        title: `Jeu Lancé: ${this.getGameDescription(id).split(' ')[0]} ${id}`,
                        event: true
                    });
                }

                if (id === 'hangman' && window.initHangman) window.initHangman(document.getElementById('game-mount'));
                if (id === 'mots-meles' && window.initMotsMeles) window.initMotsMeles(document.getElementById('game-mount'));
                if (id === 'paires' && window.initPaires) window.initPaires(document.getElementById('game-mount'));
                if (id === 'sudoku' && window.initSudoku) window.initSudoku(document.getElementById('game-mount'));
                if (id === 'match-3' && window.initMatch3) window.initMatch3(document.getElementById('game-mount'));
                if (id === 'capitales' && window.initCapitales) window.initCapitales(document.getElementById('game-mount'));
                if (id === 'scrabble' && window.initScrabble) window.initScrabble(document.getElementById('game-mount'));
                if (id === 'tetris' && window.initTetris) window.initTetris(document.getElementById('game-mount'));
                if (id === 'objets-caches' && window.initObjetsCaches) window.initObjetsCaches(document.getElementById('game-mount'));
                if (id === 'blind-test' && window.initBlindTest) window.initBlindTest(document.getElementById('game-mount'));
                if (id === 'snake' && window.initSnake) window.initSnake(document.getElementById('game-mount'));
                if (id === 'neon-pulse' && window.initNeonPulse) window.initNeonPulse(document.getElementById('game-mount'));
                if (id === '421' && window.init421) window.init421(document.getElementById('game-mount'));
                if (id === 'uno' && window.initUno) window.initUno(document.getElementById('game-mount'));
                if (id === 'suite-logique' && window.initSuiteLogique) window.initSuiteLogique(document.getElementById('game-mount'));
                if (id === 'echecs' && window.initEchecs) window.initEchecs(document.getElementById('game-mount'));
            }
        };

        window.onload = () => {
            window.arcade.installLifecycleGuards();
            if (window.arcade.state.themeMode !== 'random') {
                localStorage.setItem('arcade_theme_fixed', window.arcade.state.theme);
            }
            window.arcade.applyTheme();
            window.arcade.renderHome();
            window.arcade.checkFirstVisit();
        };
    </script>
    <!-- Système de modales standardisé -->
    <script src="games/game-modal.js"></script>
    <!-- Chargement des composants de jeux -->
    <script src="games/sudoku.js"></script>
    <script src="games/hangman.js"></script>
    <script src="games/mots-meles.js"></script>
    <script src="games/paires.js"></script>
    <script src="games/match-3.js"></script>
    <script src="games/capitales-map.js"></script>
    <script src="games/capitales.js"></script>
    <script src="games/scrabble.js"></script>
    <script src="games/audio.js"></script>
    <script src="games/tetris.js"></script>
    <script src="games/objets-caches.js"></script>
    <script src="games/blind-test.js"></script>
    <script src="games/snake.js"></script>
    <script src="games/neon-pulse.js"></script>
    <script src="games/421.js"></script>
    <script src="games/uno.js"></script>
    <script src="games/suite-logique.js"></script>
    <script src="games/vendor/js-chess-engine.js"></script>
    <script src="games/echecs.js"></script>
</body>
