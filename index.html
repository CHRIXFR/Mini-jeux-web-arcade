<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Minimaliste - Jeux Web</title>
    <meta name="description" content="Une collection de mini-jeux élégants et gratuits : Sudoku, Mots Mêlés et plus.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Configuration Analytique (GoatCounter) -->
    <script>
        window.goatcounter = {
            no_onload: true, // Désactiver le suivi automatique (on le gère manuellement)
            // REMPLACER "mon-code-goatcounter" PAR VOTRE IDENTIFIANT GOATCOUNTER
            endpoint: 'https://mini-arcade.goatcounter.com/count'
        };
    </script>
    <script data-goatcounter="https://mini-arcade.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <!-- Driver.js pour le Tour Guidé -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css" />
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>

    <!-- SortableJS pour le Drag & Drop des jeux (Favoris) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>

<body class="dark-mode">
    <header>
        <div class="header-content">
            <h1 id="main-title">Arcade Minimaliste</h1>
            <div class="user-stats">
                <button id="tour-btn" class="theme-toggle" onclick="window.arcade.startTour()"
                    title="Lancer le guide d'accueil">❓</button>
                <button id="theme-btn" class="theme-toggle" onclick="window.arcade.toggleTheme()"
                    title="Changer de thème">☀️</button>
                <button id="audio-btn" class="theme-toggle" onclick="window.arcade.toggleAudio()"
                    title="Activer/Désactiver le son">🔇</button>
            </div>
        </div>
    </header>

    <main id="app-container">
        <!-- Contenu injecté dynamiquement -->
    </main>

    <!-- Modale Changelog & Suggestions -->
    <div id="changelog-modal" class="modal-overlay" style="display: none;" aria-hidden="true" role="dialog"
        aria-labelledby="changelog-title">
        <div class="modal-content changelog-modal-content">

            <!-- Navigation par onglets -->
            <div class="changelog-tabs" role="tablist">
                <button class="tab-btn active" id="tab-btn-changelog" role="tab" aria-selected="true"
                    aria-controls="tab-changelog" onclick="switchTab('changelog')">Nouveautés 🚀</button>
                <button class="tab-btn" id="tab-btn-suggestion" role="tab" aria-selected="false"
                    aria-controls="tab-suggestion" onclick="switchTab('suggestion')">Suggérer 💡</button>
            </div>

            <!-- Panneau Changelog -->
            <div id="tab-changelog" class="tab-panel active" role="tabpanel" aria-labelledby="tab-btn-changelog">
                <div class="changelog-list">
                    <ul id="changelog-list-content">
                        <li>Chargement des dernières nouveautés... ⏳</li>
                    </ul>
                </div>
            </div>

            <!-- Panneau Formulaire de Suggestion -->
            <div id="tab-suggestion" class="tab-panel" role="tabpanel" aria-labelledby="tab-btn-suggestion">
                <p class="suggestion-intro">Une idée de jeu ou de fonctionnalité ? Faites-le nous savoir !</p>
                <form id="suggestion-form" class="suggestion-form">
                    <div class="form-group">
                        <label for="suggestion-name">Votre prénom (optionnel)</label>
                        <input type="text" id="suggestion-name" name="name" placeholder="Ex : Alex" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="suggestion-type">Type de suggestion</label>
                        <select id="suggestion-type" name="type">
                            <option value="Nouveau Jeu">🎮 Nouveau Jeu</option>
                            <option value="Nouvelle Fonctionnalité">✨ Nouvelle Fonctionnalité</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="suggestion-message">Votre suggestion <span aria-hidden="true">*</span></label>
                        <textarea id="suggestion-message" name="message" rows="4" placeholder="Décrivez votre idée..."
                            required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;" id="suggestion-submit-btn">Envoyer
                        🚀</button>
                </form>
                <div id="suggestion-success" class="form-success" style="display: none;">
                    <span>✅</span> Merci pour votre suggestion ! Nous l'avons bien reçue.
                </div>
            </div>

            <!-- Bouton Fermer commun -->
            <button
                onclick="document.getElementById('changelog-modal').style.display='none'; document.getElementById('changelog-modal').setAttribute('aria-hidden', 'true');"
                class="btn-secondary changelog-close-btn">Fermer</button>
        </div>
    </div>

    <!-- Avatar Changelog -->
    <button id="avatar-changelog"
        onclick="document.getElementById('changelog-modal').style.display='flex'; document.getElementById('changelog-modal').setAttribute('aria-hidden', 'false');"
        title="Voir les nouveautés" aria-label="Voir les nouveautés">
        <video autoplay loop muted playsinline width="100" height="100" poster="images/personnage_saluant.jpeg">
            <source src="images/Vidéo_de_personnage_saluant_en_boucle.mp4" type="video/mp4">
            <!-- Fallback pour navigateurs ne supportant pas la vidéo -->
            <img src="images/personnage_saluant.jpeg" alt="Avatar qui salue" width="100" height="100">
        </video>
    </button>

    <footer>
        <p>&copy; 2026 Arcade Minimaliste | Projet Open-Source</p>
    </footer>

    <!-- Scripts chargés classiquement (non-module pour test local) -->
    <script>
        // --- Gestion de la modale Changelog ---

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                const isActive = btn.id === `tab-btn-${tabName}`;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-selected', isActive);
            });
            document.querySelectorAll('.tab-panel').forEach(panel => {
                panel.classList.toggle('active', panel.id === `tab-${tabName}`);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('suggestion-form');
            if (!form) return;

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const submitBtn = document.getElementById('suggestion-submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = 'Envoi en cours...';

                try {
                    const response = await fetch('https://formspree.io/f/xqedogeo', {
                        method: 'POST',
                        headers: { 'Accept': 'application/json' },
                        body: new FormData(form)
                    });

                    if (response.ok) {
                        form.style.display = 'none';
                        document.getElementById('suggestion-success').style.display = 'flex';
                        // Réinitialise l'état pour la prochaine ouverture
                        setTimeout(() => {
                            form.reset();
                            form.style.display = 'block';
                            document.getElementById('suggestion-success').style.display = 'none';
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Envoyer 🚀';
                        }, 4000);
                    } else {
                        throw new Error('Réponse non-OK du serveur.');
                    }
                } catch (_err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Envoyer 🚀';
                    window.arcade.showToast('Erreur lors de l\'envoi. Réessayez.');
                }
            });

            // Chargement du changelog dynamique
            fetchChangelog();
        });

        // --- Recuperation dynamique du Changelog depuis GitHub ---
        async function fetchChangelog() {
            const listContent = document.getElementById('changelog-list-content');
            if (!listContent) return;

            try {
                // Appel à l'API publique de GitHub pour récupérer les derniers commits
                const response = await fetch('https://api.github.com/repos/CHRIXFR/Mini-jeux-web-arcade/commits?sha=main&per_page=30');
                if (!response.ok) throw new Error('Erreur API GitHub');

                const commits = await response.json();

                // Filtrer les commits contenant le tag personnalisé 'News:'
                const newsCommits = commits.filter(item => {
                    return item.commit.message.includes('News:');
                });

                if (newsCommits.length === 0) {
                    listContent.innerHTML = '<li>Aucune nouveauté récente trouvée. 🕵️‍♂️</li>';
                    return;
                }

                // Vider le message de chargement
                listContent.innerHTML = '';

                // Formater et injecter chaque news
                newsCommits.forEach(item => {
                    const message = item.commit.message;
                    // On retire le tag 'News:' (insensible à la casse si on le souhaite, ici on cherche le texte exact ou similaire)
                    const cleanMessage = message.replace(/News:\s*/i, '').trim();

                    // Formatage de la date (ex: "03/03/2026")
                    const dateObj = new Date(item.commit.author.date);
                    const formattedDate = dateObj.toLocaleDateString('fr-FR', {
                        day: '2-digit', month: '2-digit', year: 'numeric'
                    });

                    // Création de l'élément de liste
                    const li = document.createElement('li');
                    li.innerHTML = `<strong>${formattedDate}</strong> : ${cleanMessage}`;
                    listContent.appendChild(li);
                });

            } catch (error) {
                console.error('Erreur lors du chargement du changelog:', error);
                listContent.innerHTML = '<li>Impossible de charger les nouveautés pour le moment. ⚠️</li>';
            }
        }

        // Définition d'un store global simple pour remplacer Zustand/Imports
        window.arcade = {
            state: {
                theme: localStorage.getItem('arcade_theme') || 'dark',
                currentView: 'home',
                testMode: new URLSearchParams(window.location.search).has('test')
            },
            themes: [
                { id: 'dark', icon: '🌙', bg: 'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1920&auto=format' },
                { id: 'light', icon: '☀️', bg: 'https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1920&auto=format' },
                { id: 'neon', icon: '⚡', bg: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1920&auto=format' },
                { id: 'ocean', icon: '🌊', bg: 'https://images.unsplash.com/photo-1518837695005-2083093ee35b?q=80&w=1920&auto=format' }
            ],
            games: [
                { id: 'hangman', name: 'Le Pendu', icon: '😵', difficulty: 'Normal' },
                { id: 'mots-meles', name: 'Mots Mêlés', icon: '🔍', difficulty: 'Normal' },
                { id: 'paires', name: 'Paires', icon: '🃏', difficulty: 'Variable' },
                { id: 'sudoku', name: 'Sudoku', icon: '🧩', difficulty: 'Facile - Difficile' },
                { id: 'match-3', name: 'Match-3', icon: '💎', difficulty: 'Puzzle' },
                { id: 'capitales', name: 'Capitales', icon: '🌍', difficulty: 'Culture G' },
                { id: 'scrabble', name: 'Scrabble', icon: '🔡', difficulty: 'Expert' },
                { id: 'tetris', name: 'Tetris', icon: '🧱', difficulty: 'Arcade' },
                { id: 'objets-caches', name: 'Objets Cachés', icon: '🕵️', difficulty: 'Observation' },
                { id: 'blind-test', name: 'Blind Test 8-Bits', icon: '🎵', difficulty: 'Musical' }
            ],
            showToast: function (msg) {
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                document.body.appendChild(t);
                setTimeout(() => { t.classList.add('show'); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000); }, 100);
            },
            formatTime: function (seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            },
            renderHome: function () {
                document.body.classList.remove('in-game');
                this.state.currentView = 'home';

                // Nettoyage modales de jeu standardisées
                const startModal = document.getElementById('game-start-modal');
                if (startModal) startModal.remove();
                const overModal = document.getElementById('game-over-modal');
                if (overModal) overModal.remove();

                const avatar = document.getElementById('avatar-changelog');
                if (avatar) avatar.style.display = 'flex';

                // Texte hero sans XP
                const heroText = 'Choisissez un jeu et battez vos propres records ! 🏆';

                // --- CHARGEMENT DE L'ORDRE PERSONNALISÉ DES JEUX FAVORIS ---
                let orderedGames = [...this.games];
                try {
                    const savedOrderStr = localStorage.getItem('arcade_custom_order');
                    if (savedOrderStr) {
                        const savedOrder = JSON.parse(savedOrderStr);
                        if (Array.isArray(savedOrder)) {
                            orderedGames.sort((a, b) => {
                                const indexA = savedOrder.indexOf(a.id);
                                const indexB = savedOrder.indexOf(b.id);
                                if (indexA === -1 && indexB === -1) return 0;
                                if (indexA === -1) return 1; // les nouveaux jeux ou non classés vont à la fin
                                if (indexB === -1) return -1;
                                return indexA - indexB;
                            });
                        }
                    }
                } catch (e) { console.error('Erreur lecture ordre', e); }

                const gridHtml = orderedGames.map(game => {
                    const clickAction = `onclick="window.arcade.loadGame('${game.id}')"`;
                    const accessibilityProps = 'role="button" tabindex="0"';

                    // Récupérer le score depuis localstorage
                    const storageKey = `arcade_hs_${game.id}`;
                    const hsData = JSON.parse(localStorage.getItem(storageKey));
                    let hsHtml = '';
                    if (hsData) {
                        const val = hsData.type === 'time' ? window.arcade.formatTime(hsData.score) : hsData.score;
                        const label = hsData.type === 'time' ? 'Meilleur Temps' : 'Record';
                        hsHtml = `<div class="hs-badge" title="${label} : ${val}">⭐ ${val}</div>`;
                    }

                    return `
                        <div class="game-card" data-id="${game.id}" ${clickAction} ${accessibilityProps}>
                            <div class="drag-handle" title="Trier les favoris (Glisser-Déposer)" onclick="event.stopPropagation()">☰</div>
                            ${hsHtml}
                            <div class="game-icon" role="img" aria-label="Icône du jeu ${game.name}">${game.icon}</div>
                            <h3>${game.name}</h3>
                            <p>${this.getGameDescription(game.id)}</p>
                            <span class="difficulty">${game.difficulty}</span>
                        </div>
                    `;
                }).join('');

                document.getElementById('app-container').innerHTML = `
                    <section id="home-page" class="view">
                        <div class="hero">
                            <p class="subtitle">${heroText}</p>
                            <button id="btn-scroll-games" class="scroll-arrow" aria-label="Voir les jeux" onclick="document.getElementById('games-grid-container').scrollIntoView({ behavior: 'smooth' })">↓</button>
                        </div>
                        <div id="games-grid-container" class="games-grid">${gridHtml}</div>
                    </section>
                `;

                // --- INIT SORTABLEJS ---
                const gridContainer = document.getElementById('games-grid-container');
                if (gridContainer && window.Sortable) {
                    new Sortable(gridContainer, {
                        handle: '.drag-handle', // La poignée pour glisser
                        animation: 150, // Animation fluide (MS)
                        ghostClass: 'sortable-ghost',
                        onEnd: function () {
                            // Sauvegarde du nouvel ordre après relâchement
                            const itemEls = gridContainer.querySelectorAll('.game-card');
                            const newOrder = Array.from(itemEls).map(el => el.getAttribute('data-id'));
                            localStorage.setItem('arcade_custom_order', JSON.stringify(newOrder));
                        }
                    });
                }

                // Lancement BGM de l'accueil
                if (window.arcade.audio) {
                    window.arcade.audio.setContext('base');
                    window.arcade.audio.playMusic();
                }

                // Analytique (GoatCounter)
                if (window.goatcounter && window.goatcounter.count) {
                    window.goatcounter.count({
                        path: '/',
                        title: 'Accueil Arcade',
                        event: false
                    });
                }
            },
            getGameDescription: function (id) {
                const descriptions = {
                    'sudoku': 'Le classique jeu de chiffres avec fonctions avancées.',
                    'hangman': 'Devinez le mot secret avant qu\'il ne soit trop tard.',
                    'mots-meles': 'Trouvez tous les mots cachés dans la grille.',
                    'paires': 'Exercez votre mémoire en trouvant toutes les paires d\'emojis.',
                    'match-3': 'Alignez les gemmes pour exploser les scores.',
                    'capitales': 'Testez vos connaissances sur les drapeaux et capitales du monde.',
                    'scrabble': 'Placez vos mots stratégiquement sur le plateau.',
                    'tetris': 'L\'indémodable jeu de puzzle par blocs avec un style moderne.',
                    'objets-caches': 'Retrouvez les objets cachés avant la fin du temps imparti.',
                    'blind-test': 'Devinez la musique jouée par le synthétiseur.'
                };
                return descriptions[id] || '';
            },
            dictionaryCache: {
                words: null,
                async getWords() {
                    if (!this.words) {
                        const r = await fetch('games/data/French ODS dictionary.json');
                        if (!r.ok) throw new Error('Dictionnaire introuvable');
                        this.words = await r.json();
                    }
                    return this.words;
                }
            },
            toggleTheme: function () {
                const currentIndex = this.themes.findIndex(t => t.id === this.state.theme) || 0;
                const nextIndex = (currentIndex + 1) % this.themes.length;
                this.state.theme = this.themes[nextIndex].id;
                localStorage.setItem('arcade_theme', this.state.theme);
                this.applyTheme();
            },
            toggleAudio: function () {
                if (window.arcade.audio) {
                    const isMuted = window.arcade.audio.toggleMute();
                    const audioBtn = document.getElementById('audio-btn');
                    if (audioBtn) {
                        audioBtn.textContent = isMuted ? '🔇' : '🔊';
                    }
                }
            },
            applyTheme: function () {
                const current = this.themes.find(t => t.id === this.state.theme) || this.themes[0];

                document.body.classList.remove('dark-mode', 'light-mode', 'neon-mode', 'ocean-mode');
                document.body.classList.add(`${current.id}-mode`);

                const themeBtn = document.getElementById('theme-btn');
                if (themeBtn) themeBtn.textContent = current.icon;

                let bgElement = document.getElementById('dynamic-bg');
                if (!bgElement) {
                    bgElement = document.createElement('div');
                    bgElement.id = 'dynamic-bg';
                    document.body.prepend(bgElement);
                }

                bgElement.classList.remove('loaded');
                const img = new Image();
                img.src = current.bg;
                img.onload = () => {
                    bgElement.style.backgroundImage = `url(${current.bg})`;
                    bgElement.classList.add('loaded');
                };
            },
            startTour: function () {
                if (!window.driver) return;
                const isHome = this.state.currentView === 'home';
                const steps = [
                    { element: '#main-title', popover: { title: 'Bienvenue', description: 'Ceci est l\'Arcade Minimaliste. Découvrez des mini-jeux classiques dans une enveloppe moderne !', side: "bottom" } },
                    { element: '#tour-btn', popover: { title: 'Aide', description: 'Cliquez ici à tout moment pour revoir ce guide.', side: "bottom" } },
                    { element: '#theme-btn', popover: { title: 'Thèmes Dynamiques', description: 'Changez l\'apparence. Clair, sombre, néon ou avec un fond d\'écran dynamique (Unsplash !)', side: "bottom" } },
                    { element: '#audio-btn', popover: { title: 'Sons & Musique', description: 'Activez l\'ambiance sonore pour une meilleure immersion (BGM et effets).', side: "bottom" } }
                ];

                if (isHome) {
                    steps.push({ element: '#avatar-changelog', popover: { title: 'Nouveautés & Suggestions', description: 'Cliquez sur l\'avatar pour voir le changelog ou nous envoyer vos idées.', side: "left" } });
                    steps.push({ element: '#games-grid-container', popover: { title: 'Vos Favoris', description: 'Utilisez l\'icône ☰ sur chaque carte pour glisser et organiser vos jeux favoris en tête de liste !', side: "top" } });
                    steps.push({ element: '#games-grid-container', popover: { title: 'Accès Immédiat & Scores', description: 'Battez vos records : ils sont sauvegardés localement.', side: "top" } });
                }

                const driverObj = window.driver.js.driver({
                    showProgress: true,
                    nextBtnText: 'Suivant →',
                    prevBtnText: '← Précédent',
                    doneBtnText: 'C\'est parti !',
                    steps: steps
                });
                driverObj.drive();
            },
            checkFirstVisit: function () {
                if (!localStorage.getItem('arcade_tour_done')) {
                    setTimeout(() => {
                        this.startTour();
                        localStorage.setItem('arcade_tour_done', 'true');
                    }, 500);
                }
            },
            loadGame: function (id) {
                document.body.classList.add('in-game');
                this.state.currentView = id;
                const avatar = document.getElementById('avatar-changelog');
                if (avatar) avatar.style.display = 'none';
                document.getElementById('app-container').innerHTML = `
                    <div class="game-view">
                        <button onclick="window.arcade.renderHome()" class="btn-secondary">← Retour</button>
                        <div id="game-mount"></div>
                    </div>
                `;

                // Contexte audio adapté au jeu
                if (window.arcade.audio) {
                    window.arcade.audio.setContext(id);
                    window.arcade.audio.playMusic();
                }

                // Analytique (GoatCounter) - Événement jeu joué
                if (window.goatcounter && window.goatcounter.count) {
                    window.goatcounter.count({
                        path: `load-game-${id}`,
                        title: `Jeu Lancé: ${this.getGameDescription(id).split(' ')[0]} ${id}`,
                        event: true
                    });
                }

                if (id === 'hangman' && window.initHangman) window.initHangman(document.getElementById('game-mount'));
                if (id === 'mots-meles' && window.initMotsMeles) window.initMotsMeles(document.getElementById('game-mount'));
                if (id === 'paires' && window.initPaires) window.initPaires(document.getElementById('game-mount'));
                if (id === 'sudoku' && window.initSudoku) window.initSudoku(document.getElementById('game-mount'));
                if (id === 'match-3' && window.initMatch3) window.initMatch3(document.getElementById('game-mount'));
                if (id === 'capitales' && window.initCapitales) window.initCapitales(document.getElementById('game-mount'));
                if (id === 'scrabble' && window.initScrabble) window.initScrabble(document.getElementById('game-mount'));
                if (id === 'tetris' && window.initTetris) window.initTetris(document.getElementById('game-mount'));
                if (id === 'objets-caches' && window.initObjetsCaches) window.initObjetsCaches(document.getElementById('game-mount'));
                if (id === 'blind-test' && window.initBlindTest) window.initBlindTest(document.getElementById('game-mount'));
            }
        };

        window.onload = () => {
            window.arcade.applyTheme();
            window.arcade.renderHome();
            window.arcade.checkFirstVisit();
        };
    </script>
    <!-- Système de modales standardisé -->
    <script src="games/game-modal.js"></script>
    <!-- Chargement des composants de jeux -->
    <script src="games/sudoku.js"></script>
    <script src="games/hangman.js"></script>
    <script src="games/mots-meles.js"></script>
    <script src="games/paires.js"></script>
    <script src="games/match-3.js"></script>
    <script src="games/capitales.js"></script>
    <script src="games/scrabble.js"></script>
    <script src="games/audio.js"></script>
    <script src="games/tetris.js"></script>
    <script src="games/objets-caches.js"></script>
    <script src="games/blind-test.js"></script>
</body>

</html>
